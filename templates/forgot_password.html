{% extends "base.html" %}
{% block title %}Lupa Password · wormhole-mini{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}
{% block body %}
<div class="auth-box">
  <h2>Lupa Password</h2>
  <p class="auth-sub">wormhole-mini</p>

  <div id="step-request" class="step active">
    <label>Email akun kamu</label>
    <input type="email" id="fp-email" placeholder="email@kamu.com">
    <button id="btn-request" class="btn btn-primary btn-block">Kirim Kode Reset</button>
  </div>

  <div id="step-reset" class="step">
    <label>Kode reset (cek email kamu)</label>
    <input type="text" id="fp-code" placeholder="Kode dari email" maxlength="12">
    <label>Password baru</label>
    <div class="pw-wrap">
      <input type="password" id="fp-new-password" placeholder="Min. 6 karakter">
      <button type="button" class="pw-toggle" data-target="fp-new-password" title="Lihat/sembunyikan password" aria-label="Lihat atau sembunyikan password" aria-pressed="false">👁️</button>
    </div>
    <button id="btn-reset" class="btn btn-primary btn-block">Ganti Password</button>
  </div>

  <div id="status"></div>
  <div class="switch-link"><a href="/login">← Kembali ke login</a></div>
</div>

<script src="/static/js/forgot-password.js"></script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Lupa Password · wormhole-mini{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}
{% block body %}
<main class="auth-box">
  <h1>Lupa Password</h1>
  <p class="auth-sub">wormhole-mini</p>

  <form id="step-request" class="step active" novalidate>
    <label for="fp-email">Email akun kamu</label>
    <input type="email" id="fp-email" name="email" placeholder="email@kamu.com" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" required>
    <button type="submit" id="btn-request" class="btn btn-primary btn-block">Kirim Kode Reset</button>
  </form>

  <form id="step-reset" class="step" novalidate>
    <p class="step-info">Kode reset dikirim ke <strong id="reset-email"></strong>.</p>
    <p class="hint">Belum sampai? Cek folder spam atau promosi.</p>
    <label for="fp-code">Kode reset</label>
    <input type="text" id="fp-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="Kode dari email" required>
    <label for="fp-new-password">Password baru</label>
    <div class="pw-wrap">
      <input type="password" id="fp-new-password" name="new-password" autocomplete="new-password" aria-describedby="fp-pw-hint" required>
      <button type="button" class="pw-toggle" data-target="fp-new-password" title="Lihat/sembunyikan password" aria-label="Lihat atau sembunyikan password" aria-controls="fp-new-password" aria-pressed="false">👁️</button>
    </div>
    <p class="hint" id="fp-pw-hint">Minimal 6 karakter.</p>
    <button type="submit" id="btn-reset" class="btn btn-primary btn-block">Ganti Password</button>
    <div class="step-actions">
      <button type="button" id="btn-resend" class="btn btn-secondary btn-block">Kirim ulang kode</button>
      <button type="button" id="btn-change-email" class="btn-link">Salah email? Ganti email</button>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div class="switch-link"><a href="/login">← Kembali ke halaman masuk</a></div>
</main>

<script src="/static/js/auth-common.js"></script>
<script src="/static/js/forgot-password.js"></script>
{% endblock %}
